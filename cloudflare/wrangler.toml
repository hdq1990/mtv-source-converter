name = "mtv-source-converter"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# KV 存储：保存配置数据
# 部署后需在 Cloudflare 控制台创建 KV namespace，名称为 CONFIG
[kv_namespaces]
binding = "KV"
id = "请替换为你的KV namespace ID"

# 定时任务：每 2 小时抓取一次
[triggers]
cron = ["0 */2 * * *"]

# 自定义域名（可选）
# routes = [
#   { pattern = "mtv-source.yourdomain.com/*", custom_domain = true }
# ]
