name = "mtv-source-converter"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

# 自定义域：国内无法直连 *.workers.dev（DNS 污染 + TLS RST），
# 必须绑一个托管在本账号 Cloudflare 的域名才能访问。
routes = [
  { pattern = "mtv.hdq1990.us.ci", custom_domain = true }
]

[observability]
enabled = true

[triggers]
# 每 2 小时两跳：
#   第 0 分 → 抓取 + 转换 + 编码「全部版」+ 写全部 KV
#   第 2 分 → 只给「屏蔽版」补 Base58 编码（从 KV 读明文，不再打上游）
# 拆开是为了把单次调用的 Base58 编码 CPU 从 28 ms 压到 14 ms，
# 尽量贴合 Workers 免费套餐 10 ms/次 的 CPU 预算。
crons = ["0 */2 * * *", "2 */2 * * *"]

[[kv_namespaces]]
binding = "CONFIG"
id = "615f11f18dc243b99401906e443e7173"
preview_id = "9b99300f2b034795ba6c7da378cceff8"

[vars]
SOURCE_URL = "https://www.ziyuanzu.com/download/ziyuanzu-cms-interfaces.json"
CACHE_TIME = "7200"
FETCH_TIMEOUT = "30"
FETCH_RETRIES = "3"
STALE_IF_ERROR_HOURS = "72"
