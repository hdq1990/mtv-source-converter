name = "mtv-source-converter"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

# 自定义域：国内无法直连 *.workers.dev（DNS 污染 + TLS RST），
# 必须绑一个托管在本账号 Cloudflare 的域名才能访问。
routes = [
  { pattern = "mtv.hdq1990.us.ci", custom_domain = true }
]

[observability]
enabled = true

[triggers]
# 每天两次抓取，全部 UTC（Cloudflare 免费账号全账号只有 5 个 cron trigger，
# 其余 Worker 已占用 4 个，所以这里把两个时刻塞进同一个表达式的小时列表）：
#   0 5,17 * * *  →  北京 13:00 和 次日 01:00
# 一次调用里做完抓取 + 合并 + 剔除死源 + 两份 Base58 编码。
crons = ["0 5,17 * * *"]

[[kv_namespaces]]
binding = "CONFIG"
id = "615f11f18dc243b99401906e443e7173"
preview_id = "9b99300f2b034795ba6c7da378cceff8"

[vars]
SOURCE_URL = "https://www.ziyuanzu.com/download/ziyuanzu-cms-interfaces.json"
# 逗号分隔的额外源，自动识别三种格式：裸采集站数组 / MoonTVPlus 明文 JSON / Base58 订阅串。
# 这里用明文 JSON（最省 CPU）；换成自己的源或者 raw base58 直链也能吃。
EXTRA_SOURCES = "https://pz.v88.qzz.io?format=0&source=full"
CACHE_TIME = "7200"
FETCH_TIMEOUT = "30"
FETCH_RETRIES = "3"
STALE_IF_ERROR_HOURS = "72"
# 源可用性探测：每次调用测 PROBE_LIMIT 个，连续失败 PROBE_FAIL_THRESHOLD 次就从输出里剔除
PROBE_ENABLED = "true"
PROBE_LIMIT = "25"
PROBE_TIMEOUT = "8"
PROBE_FAIL_THRESHOLD = "2"
